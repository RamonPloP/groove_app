<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Asistencia - Academia</title>

  <!-- Fuente personalizada -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">

  <style>
    @font-face {
      font-family: 'Newpitch';
      src: url('/static/assets/fonts/Newpitch.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Source Sans Pro', sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 1)),
                  url('/static/assets/img/background-dashboard.jpg') center center no-repeat;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      color: white;
    }

    h1 {
      font-family: 'Newpitch', sans-serif;
      font-size: 60px;
      margin-bottom: 40px;
    }

    .logo {
      height: 250px;
      width: 250px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      border: 5px solid white;
    }

    #scanner {
      margin-top: 40px;
      font-size: 24px;
      padding: 15px;
      width: 300px;
      border-radius: 8px;
      border: none;
      text-align: center;
      outline: none;
    }

    #success {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>¡Bienvenido a Lost in Groove!</h1>
    <img src="/static/assets/img/logo_favicon.jpg" alt="Logo" class="logo">
    <br>
    <input type="text" id="scanner" placeholder="Escanea tu código..." autofocus />
    <div id="success"></div>
  </div>

  <script>
    const scannerInput = document.getElementById('scanner');
    const successMessage = document.getElementById('success');

    // Simulación de base de datos de miembros
    const members = {
      "123456": "Juan Pérez",
      "789012": "María López",
      "345678": "Carlos García"
    };

    scannerInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const code = scannerInput.value.trim();
        const name = members[code];
        const now = new Date();
        const time = now.toLocaleTimeString();

        if (name) {
          successMessage.textContent = `✅ Asistencia registrada para ${name} a las ${time}`;
          successMessage.style.color = 'limegreen';
        } else {
          successMessage.textContent = `❌ Código no reconocido`;
          successMessage.style.color = 'red';
        }

        successMessage.style.display = 'block';
        scannerInput.value = '';
        setTimeout(() => {
          successMessage.style.display = 'none';
        }, 3000);
      }
    });
  </script>
</body>
</html>
